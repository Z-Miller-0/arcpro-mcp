[project]
name = "arcpro-mcp"
version = "0.2.0"
description = "MCP server that lets Claude work in ArcGIS Pro through a small bridge script"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "anyio>=4"]

[project.scripts]
arcpro-mcp = "arcpro_mcp.server:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcpro_mcp"]
