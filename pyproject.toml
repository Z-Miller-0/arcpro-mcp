[project]
name = "arcpro-mcp"
dynamic = ["version"]
description = "MCP server that lets Claude work in ArcGIS Pro through a small bridge script"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zachary Miller" }]
keywords = ["mcp", "arcgis", "arcgis-pro", "arcpy", "gis", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["mcp>=1.12,<2", "anyio>=4,<5"]

[project.urls]
Homepage = "https://github.com/Z-Miller-0/arcpro-mcp"
Changelog = "https://github.com/Z-Miller-0/arcpro-mcp/blob/main/CHANGELOG.md"

[project.scripts]
arcpro-mcp = "arcpro_mcp.server:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling>=1.27,<2"]  # 1.27 reads the SPDX license and license-files fields
build-backend = "hatchling.build"

# One version for the package; tests/test_install.py checks the bridge says the same.
[tool.hatch.version]
path = "src/arcpro_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arcpro_mcp"]

# The bridge runs inside ArcGIS Pro, not in this package, but ships with it so that
# `arcpro-mcp install` can copy the matching version into place.
[tool.hatch.build.targets.wheel.force-include]
"bridge/arcpro_bridge.py" = "arcpro_mcp/bridge/arcpro_bridge.py"
"bridge/ArcProMCP.pyt" = "arcpro_mcp/bridge/ArcProMCP.pyt"

[tool.hatch.build.targets.sdist]
include = ["src", "bridge", "tests", "README.md", "CHANGELOG.md", "LICENSE", "uv.lock"]
